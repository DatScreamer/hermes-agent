name: Bootstrap installer unsigned build

# Hand-dispatched UNSIGNED builds of the Tauri bootstrap installer
# (apps/bootstrap-installer, "Hermes-Setup") for local verification on
# Apple Silicon Macs: no Developer ID certificate, no notarization, uploaded
# as run artifacts only. Gatekeeper will block the app on first launch;
# right-click -> Open (or `xattr -cr`) to run it.
#
# No caches of any kind: no actions/cache, no setup-node cache, and fresh
# npm/cargo cache dirs under RUNNER_TEMP.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        required: true
        default: fix/installer-follow-system-theme

permissions:
  contents: read
  actions: write

concurrency:
  group: bootstrap-installer-unsigned-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: '0'
  SCCACHE_DISABLE: '1'

jobs:
  macos-arm64:
    name: Hermes-Setup.dmg (macos arm64, unsigned)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: 24.11.1

      - name: Fresh cache dirs
        run: |
          {
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-home"
            echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Select Xcode 26 for the macOS 26 layered icon
        # Tauri's bundler compiles src-tauri/icons/icon.icon to Assets.car with
        # actool, which only Xcode >= 26 ships. The runner keeps an older
        # Xcode selected, and DEVELOPER_DIR alone does not always reach the
        # tool Tauri shells out to — so switch the active developer dir AND
        # put its usr/bin on PATH. Smoke-check actool before the long build.
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::warning::no Xcode 26 on this runner; the .icon package may fail to compile"
          else
            echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
            echo "$xcode/Contents/Developer/usr/bin" >> "$GITHUB_PATH"
            sudo xcode-select --switch "$xcode/Contents/Developer"
          fi
          xcrun --find actool || echo "::warning::xcrun cannot find actool"

      - name: Build (unsigned)
        run: |
          rustup target add aarch64-apple-darwin
          npm ci --workspace apps/bootstrap-installer --include-workspace-root=false --prefer-online --no-audit --no-fund
          cd apps/bootstrap-installer
          npx tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Collect artifacts
        run: |
          shopt -s nullglob
          bundle="$CARGO_TARGET_DIR/aarch64-apple-darwin/release/bundle"
          dmgs=("$bundle"/dmg/*.dmg)
          apps=("$bundle"/macos/*.app)
          test ${#dmgs[@]} -eq 1 || { echo "::error::expected exactly one dmg, found ${#dmgs[@]}"; exit 1; }
          test ${#apps[@]} -eq 1 || { echo "::error::expected exactly one app, found ${#apps[@]}"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out"
          cp "${dmgs[0]}" "$RUNNER_TEMP/out/Hermes-Setup-unsigned.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hermes-Setup-macos-arm64-unsigned
          path: ${{ runner.temp }}/out/Hermes-Setup-unsigned.dmg
          if-no-files-found: error
